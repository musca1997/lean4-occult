name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan (user-level)
        run: |
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          lean --version
          lake --version
          cat lean-toolchain

      - name: Fetch dependencies
        run: lake update

      - name: Get Mathlib cache
        run: lake exe cache get

      - name: Build library, tests and CLI
        run: lake build

      - name: CLI smoke tests
        run: ./scripts/smoke.sh

      - name: Proof hygiene (forbidden keywords, custom axioms, axiom whitelist)
        run: ./scripts/check_hygiene.sh
